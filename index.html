<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Catalogue des Sorts</title>
<style>
  :root {
    --ink:#2b1b10;
    --muted:#6d5a43;
    --purple:#5d1478;
    --green:#2e6b42;
    --red:#9b3151;
    --gold:#9b6b24;
    --paper:#efe0bd;
    --paper2:#f7edcf;
    --shadow:rgba(44, 26, 8, .22);
  }
  * { box-sizing: border-box; }
  body {
    margin:0;
    color:var(--ink);
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 20%, rgba(255,255,255,.42), transparent 36rem),
      radial-gradient(circle at 12% 8%, rgba(90,55,12,.14), transparent 18rem),
      radial-gradient(circle at 90% 84%, rgba(87,53,16,.18), transparent 25rem),
      linear-gradient(110deg, #c9ab70, #f2dfad 38%, #d5b97c);
    font-family: Georgia, "Times New Roman", serif;
    padding: 26px;
  }
  body::before {
    content:"";
    position:fixed; inset:0; pointer-events:none;
    opacity:.23;
    background-image:
      linear-gradient(90deg, rgba(79,45,10,.09) 1px, transparent 1px),
      linear-gradient(rgba(79,45,10,.07) 1px, transparent 1px);
    background-size: 38px 38px;
    mix-blend-mode:multiply;
  }
  .page {
    max-width: 1480px;
    margin: 0 auto;
    background:
      radial-gradient(circle at 50% 38%, rgba(158,229,174,.25), transparent 18rem),
      linear-gradient(90deg, rgba(118,81,23,.10), transparent 4%, transparent 96%, rgba(55,32,11,.22)),
      var(--paper2);
    border: 1px solid rgba(72,43,14,.35);
    border-radius: 18px;
    box-shadow: 0 28px 70px var(--shadow);
    overflow:visible;
    position:relative;
  }
  .page::after {
    content:"";
    position:absolute; inset:0; pointer-events:none; opacity:.18;
    background:
      radial-gradient(circle at 20% 30%, rgba(83,41,5,.13) 0 1px, transparent 2px),
      radial-gradient(circle at 70% 80%, rgba(83,41,5,.13) 0 1px, transparent 2px);
    background-size: 31px 29px, 43px 41px;
  }
  header {
    padding: 30px 34px 18px;
    border-bottom: 1px solid rgba(80,45,12,.22);
    position:relative;
    z-index:1;
  }
  h1 {
    margin:0;
    font-size: clamp(2.4rem, 5vw, 4.5rem);
    letter-spacing:.02em;
    font-weight: 700;
    color:#271506;
    text-shadow: 0 1px 0 #fff2c8;
    line-height: 1;
  }
  .subtitle {
    margin: 12px 0 0;
    color:var(--muted);
    font-style:italic;
    font-size:1.05rem;
  }
  .controls {
    position:relative;
    z-index:1;
    padding: 20px 28px 22px;
    display:grid;
    gap:16px;
    background: rgba(239,224,189,.48);
    border-bottom: 1px solid rgba(80,45,12,.18);
  }
  .search-row {
    display:grid;
    grid-template-columns: minmax(240px, 1fr) auto auto;
    gap:12px;
    align-items:center;
  }
  input, select, button {
    font: inherit;
    color:var(--ink);
    border: 1px solid rgba(71,38,9,.35);
    background: rgba(255,247,221,.84);
    border-radius: 999px;
    padding: 12px 15px;
    box-shadow: inset 0 1px 2px rgba(74,44,12,.10);
  }
  input {
    width: 100%;
    padding-left: 42px;
    background-image: linear-gradient(transparent, transparent);
  }
  .searchbox { position: relative; }
  .searchbox::before {
    content:"⌕";
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    font-size:1.2rem;
    color:var(--purple);
    z-index:2;
  }
  button {
    cursor:pointer;
    background: linear-gradient(#fff3cc, #e6c98e);
    font-weight:600;
  }
  button:hover { filter:brightness(.98); }
  .filters {
    display:grid;
    grid-template-columns: repeat(6, minmax(160px, 1fr));
    gap:10px;
  }
  .stats {
    display:flex;
    flex-wrap:wrap;
    gap:8px 12px;
    color:var(--muted);
    font-size:.95rem;
    align-items:center;
  }
  .pill {
    border:1px solid rgba(71,38,9,.25);
    border-radius:999px;
    padding:6px 10px;
    background:rgba(255,248,224,.52);
  }
  .table-wrap {
    position:relative;
    z-index:1;
    padding: 22px 26px 30px;
    overflow-x:auto;
    overflow-y:visible;
    max-height:none;
  }
  table {
    width:100%;
    border-collapse:separate;
    border-spacing:0;
    min-width:1180px;
  }
  thead th {
    position: sticky;
    top: 0;
    z-index:3;
    padding:12px 10px;
    text-align:left;
    font-size:1.05rem;
    color:#241306;
    background: linear-gradient(#eddcae, #dec48d);
    border-top:1px solid rgba(72,43,14,.35);
    border-bottom:1px solid rgba(72,43,14,.35);
    cursor:pointer;
    white-space:nowrap;
  }
  thead th:first-child { border-radius:12px 0 0 12px; border-left:1px solid rgba(72,43,14,.35); }
  thead th:last-child { border-radius:0 12px 12px 0; border-right:1px solid rgba(72,43,14,.35); }
  tbody tr {
    background: rgba(255,248,225,.62);
    box-shadow: 0 2px 9px rgba(67,40,12,.08);
  }
  tbody td {
    padding:12px 10px;
    vertical-align:top;
    border-top: 1px solid rgba(74,43,13,.13);
    border-bottom: 1px solid rgba(74,43,13,.13);
  }
  tbody td:first-child {
    border-left: 1px solid rgba(74,43,13,.13);
    border-radius:10px 0 0 10px;
  }
  tbody td:last-child {
    border-right: 1px solid rgba(74,43,13,.13);
    border-radius:0 10px 10px 0;
  }
  .spell {
    color:var(--purple);
    font-weight:700;
    font-size:1.08rem;
    white-space:nowrap;
  }
  .desc {
    color:#594a38;
    line-height:1.25;
    min-width:290px;
  }

  .detail-row {
    background: rgba(255,248,225,.62);
    box-shadow: 0 2px 9px rgba(67,40,12,.08);
  }
  .detail-row td {
    padding: 0 18px 12px 34px;
    border-top: none;
    border-radius: 0 0 10px 10px;
  }
  .detail-content {
    color:#594a38;
    line-height:1.35;
    font-style:italic;
  }
  .detail-content::before {
    content:"";
  }
  .clarif-line {
    margin-top:5px;
    color:#6c604d;
    font-size:.92rem;
    font-style:italic;
  }
  .level-badge {
    display:inline-block;
    min-width:104px;
    text-align:center;
    padding:4px 9px;
    border-radius:999px;
    font-weight:700;
    font-size:.88rem;
    border:1px solid rgba(63,43,12,.22);
    box-shadow: inset 0 1px 2px rgba(255,255,255,.45);
  }
  .level-basique {
    background:#d9efce;
    color:#255b24;
  }
  .level-intermediaire {
    background:#f3df8b;
    color:#6a4a08;
  }
  .level-avance {
    background:#efb0a8;
    color:#7a1f1a;
  }
  .level-other {
    background:#e7d8b5;
    color:#4d3c25;
  }
  .category-emoji {
    margin-left:5px;
    opacity:.92;
  }

  .tag {
    display:inline-block;
    border-radius:999px;
    padding:3px 8px;
    background:rgba(108,74,22,.10);
    border:1px solid rgba(108,74,22,.16);
    white-space:nowrap;
  }
  .car-Corps { color:#b88718; font-weight:700; }
  .car-Cœur { color:var(--red); font-weight:700; }
  .car-Esprit { color:#24659a; font-weight:700; }
  .clarif {
    color:#6c604d;
    font-size:.92rem;
    font-style:italic;
  }
  .empty { color:#a18b68; }
  mark {
    background:#e6ef9b;
    color:inherit;
    padding:0 .08em;
    border-radius:3px;
  }
  .no-results {
    padding:38px;
    text-align:center;
    color:var(--muted);
    font-style:italic;
  }
  footer {
    position:relative;
    z-index:1;
    padding: 0 30px 26px;
    color:rgba(52,31,10,.65);
    font-size:.9rem;
  }
  
  thead th:nth-child(2), thead th:nth-child(3), thead th:nth-child(4), thead th:nth-child(5),
  tbody td:nth-child(2), tbody td:nth-child(3), tbody td:nth-child(4), tbody td:nth-child(5) {
    text-align:center;
  }

  .detail-row td {
    border-bottom: 3px solid rgba(74,43,13,.28);
    padding-bottom:16px;
  }

  .detail-row {
    margin-bottom:6px;
  }


  @media (max-width: 1000px) {
    body { padding:10px; }
    .search-row { grid-template-columns:1fr; }
    .filters { grid-template-columns: 1fr 1fr; }
    .table-wrap { max-height:none; padding:14px; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Catalogue des Sorts</h1>
    <p class="subtitle">Grimoire interactif — recherche dans l’incantation, la description et toutes les colonnes.</p>
  </header>

  <section class="controls">
    <div class="search-row">
      <div class="searchbox"><input id="search" type="search" placeholder="Rechercher un sort, une description, un contre-sort, un prérequis…" autocomplete="off"></div>
      <select id="sortSelect" title="Tri">
        <option value="Incantation|asc">Tri : Incantation A → Z</option>
        <option value="Incantation|desc">Tri : Incantation Z → A</option>
        <option value="Niveau|asc">Tri : Niveau croissant</option>
        <option value="Niveau|desc">Tri : Niveau décroissant</option>
        <option value="Catégorie|asc">Tri : Catégorie</option>
        <option value="Caractéristique|asc">Tri : Caractéristique</option>
      </select>
      <button id="reset">Réinitialiser</button>
    </div>
    <div class="filters" id="filters"></div>
    <div class="stats">
      <span class="pill" id="count"></span>
      <span class="pill">Astuce : clique sur un en-tête pour trier.</span>
    </div>
  </section>

  <main class="table-wrap">
    <table id="spellTable">
      <thead><tr id="thead"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="noResults" class="no-results" hidden>Aucun sort ne correspond à la recherche.</div>
  </main>

  <footer>Colonnes utilisées : premier onglet uniquement, A à J. La colonne K est ignorée.</footer>
</div>

  .trim();

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function highlight(text, q) {
  const value = escapeHtml(text || "");
  const terms = normalize(q).split(/\s+/).filter(Boolean);
  if (!terms.length) return value || '<span class="empty">—</span>';
  let out = value;
  // Accent-insensitive highlight is complex after escaping; use simple visible term matching for safety.
  for (const term of terms) {
    if (term.length < 2) continue;
    const rx = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "ig");
    out = out.replace(rx, "<mark>$1</mark>");
  }
  return out || '<span class="empty">—</span>';
}

function fieldText(row) {
  return [...HEADERS.map(h => row[h] ?? ""), row["Description"] ?? "", row["Clarification"] ?? ""].join(" ");
}

function matchesSearch(row) {
  const q = normalize(state.q);
  if (!q) return true;
  const haystack = normalize(fieldText(row));
  return q.split(/\s+/).filter(Boolean).every(term => haystack.includes(term));
}

function matchesFilters(row) {
  return Object.entries(state.filters).every(([k,v]) => !v || String(row[k] ?? "") === v);
}

function sortRows(rows) {
  const {sortKey, sortDir} = state;
  const dir = sortDir === "desc" ? -1 : 1;
  return [...rows].sort((a,b) => {
    let av = String(a[sortKey] ?? "");
    let bv = String(b[sortKey] ?? "");
    if (sortKey === "Niveau") {
      av = parseInt(av, 10) || 0; bv = parseInt(bv, 10) || 0;
      return (av - bv) * dir || String(a.Incantation).localeCompare(String(b.Incantation), "fr");
    }
    return av.localeCompare(bv, "fr", {numeric:true, sensitivity:"base"}) * dir;
  });
}


const CATEGORY_EMOJIS = {
  "Attaque": "⚔️",
  "Contre-sort": "🪄",
  "Cours de récré": "🎭",
  "Domestique": "🧹",
  "Défense": "🛡️",
  "Métamorphose": "🦋",
  "Sceau de protection": "🔏",
  "Soin": "✨",
  "Sortilège": "📜"
};

function levelClass(value) {
  const v = normalize(value);
  if (v.includes("basique")) return "level-basique";
  if (v.includes("intermediaire")) return "level-intermediaire";
  if (v.includes("avance")) return "level-avance";
  return "level-other";
}

function levelBadge(value) {
  return `<span class="level-badge ${levelClass(value)}">${highlight(value, state.q)}</span>`;
}

function categoryWithEmoji(value) {
  const emoji = CATEGORY_EMOJIS[value] || "📜";
  return `${highlight(value, state.q)}<span class="category-emoji">${emoji}</span>`;
}

function uniqueValues(key) {
  return [...new Set(DATA.map(r => r[key]).filter(v => v !== undefined && v !== null && String(v).trim() !== "").map(v => String(v).trim()))]
    .sort((a,b) => a.localeCompare(b, "fr", {numeric:true, sensitivity:"base"}));
}

function buildFilters() {
  const box = document.getElementById("filters");
  box.innerHTML = "";
  for (const key of FILTERS) {
    const sel = document.createElement("select");
    sel.innerHTML = `<option value="">${key} : tous</option>` + uniqueValues(key).map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
    sel.addEventListener("change", () => { state.filters[key] = sel.value; render(); });
    box.appendChild(sel);
  }
}

function buildHeader() {
  const tr = document.getElementById("thead");
  tr.innerHTML = HEADERS.map(h => `<th data-key="${escapeHtml(h)}" class="${["Informulé ?","Niveau","Caractéristique","Catégorie"].includes(h) ? "center-col" : ""}">${escapeHtml(h)} <span class="sortmark"></span></th>`).join("");
  tr.querySelectorAll("th").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      if (state.sortKey === key) state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
      else { state.sortKey = key; state.sortDir = "asc"; }
      document.getElementById("sortSelect").value = `${state.sortKey}|${state.sortDir}`;
      render();
    });
  });
}

function cellClass(header, value) {
  if (header === "Incantation") return "spell";
  if (header === "Description") return "desc";
  if (header === "Clarification") return "clarif";
  if (header === "Caractéristique") return "car-" + String(value || "").replace(/[^\p{L}]/gu,"");
  return "";
}

function cellContent(header, value) {
  const txt = value || "";
  if (!txt) return '<span class="empty">—</span>';
  if (header === "Niveau") return levelBadge(txt);
  if (header === "Catégorie") return `<span class="tag">${categoryWithEmoji(txt)}</span>`;
  if (["Caractéristique","Découverte","Informulé ?","Contre-sort","Pré-requis"].includes(header)) {
    return `<span class="tag">${highlight(txt, state.q)}</span>`;
  }
  return highlight(txt, state.q);
}

function render() {
  let filtered = DATA.filter(matchesSearch).filter(matchesFilters);
  filtered = sortRows(filtered);
  const tbody = document.getElementById("tbody");
  const visibleRows = filtered.map(row => {
    const mainRow = `<tr>${HEADERS.map(h => `<td class="${( ["Informulé ?","Niveau","Caractéristique","Catégorie"].includes(h) ? "center-col " : "" ) + cellClass(h, row[h])}">${cellContent(h, row[h])}</td>`).join("")}</tr>`;
    const desc = row["Description"] || "";
    const clarif = row["Clarification"] || "";
    const detailRow = `<tr class="detail-row"><td colspan="${HEADERS.length}">
      <div class="detail-content">${desc ? highlight(desc, state.q) : '<span class="empty">Pas de description.</span>'}</div>
      ${clarif ? `<div class="clarif-line"><strong>Clarification :</strong> ${highlight(clarif, state.q)}</div>` : ""}
    </td></tr>`;
    return mainRow + detailRow;
  }).join("");
  tbody.innerHTML = visibleRows;
  document.getElementById("noResults").hidden = filtered.length !== 0;
  document.getElementById("spellTable").hidden = filtered.length === 0;
  document.getElementById("count").textContent = `${filtered.length} sort${filtered.length > 1 ? "s" : ""} affiché${filtered.length > 1 ? "s" : ""} / ${DATA.length}`;
  document.querySelectorAll("th").forEach(th => {
    const mark = th.querySelector(".sortmark");
    mark.textContent = th.dataset.key === state.sortKey ? (state.sortDir === "asc" ? " ↑" : " ↓") : "";
  });
}

document.getElementById("search").addEventListener("input", e => { state.q = e.target.value; render(); });
document.getElementById("sortSelect").addEventListener("change", e => {
  const [key, dir] = e.target.value.split("|");
  state.sortKey = key; state.sortDir = dir; render();
});
document.getElementById("reset").addEventListener("click", () => {
  state.q = ""; state.filters = Object.fromEntries(FILTERS.map(f => [f, ""])); state.sortKey = "Incantation"; state.sortDir = "asc";
  document.getElementById("search").value = "";
  document.getElementById("sortSelect").value = "Incantation|asc";
  buildFilters();
  render();
});

buildHeader();
buildFilters();
render();
</script>
</body>
</html>
